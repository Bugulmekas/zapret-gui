name: Update tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    name: Тесты самообновления (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]

    steps:
      - name: Получение кода
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # GitHub не допускает выражения в ключе step.shell, поэтому интерпретатор
      # из матрицы запускается как дочерний процесс (см. Run-UpdateChecks.ps1):
      # ключ shell опущен, дефолтный pwsh только порождает дочерний процесс.
      - name: Pester-тесты и проверки tools
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./tests/Run-UpdateChecks.ps1; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
