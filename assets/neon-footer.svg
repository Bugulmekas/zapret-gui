<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="86" viewBox="0 0 1000 86" role="img" aria-label="Bugulmek">

  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="18%" stop-color="#00F5FF"/>
      <stop offset="82%" stop-color="#FF2BD6"/>
      <stop offset="100%" stop-color="#FF2BD6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#00F5FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1C2B45" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="86" fill="#0D1117"/>
  <line x1="0" y1="1" x2="1000" y2="1" stroke="url(#line)" stroke-width="2"/>
  <g font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace">
    <circle cx="330" cy="44" r="2" fill="#FF2BD6"/>
    <circle cx="670" cy="44" r="2" fill="#00F5FF"/>
    <text x="500" y="49" fill="#7C8DA6" font-size="11" text-anchor="middle" letter-spacing="5">// MADE BY BUGULMEK</text>
  </g>
  <text x="500" y="70" fill="#3A4A63" font-size="10" text-anchor="middle" letter-spacing="3" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace">github.com/Bugulmekas</text>
</svg>
