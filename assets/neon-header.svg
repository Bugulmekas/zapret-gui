<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="176" viewBox="0 0 1000 176" role="img" aria-label="Zapret Control">

  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="18%" stop-color="#00F5FF"/>
      <stop offset="82%" stop-color="#FF2BD6"/>
      <stop offset="100%" stop-color="#FF2BD6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#00F5FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1C2B45" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="176" fill="#0D1117"/>
  <rect width="1000" height="176" fill="url(#grid)" opacity="0.30"/>
  <ellipse cx="180" cy="88" rx="330" ry="140" fill="url(#halo)"/>
  <text x="966" y="158" fill="#00F5FF" font-size="150" font-weight="700" opacity="0.035" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace">Z</text>

  <path d="M1 34V15a14 14 0 0 1 14-14h34" fill="none" stroke="#00F5FF" stroke-width="2.5" filter="url(#soft)"/>
  <path d="M999 142v19a14 14 0 0 1-14 14h-34" fill="none" stroke="#FF2BD6" stroke-width="2.5" filter="url(#soft)"/>

  <text x="46" y="42" fill="#7C8DA6" font-size="11" letter-spacing="4" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace">// BUGULMEK · TOOL</text>

  <g filter="url(#glow)" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace">
    <text x="44" y="103" fill="#FF2BD6" opacity="0.45" font-size="44" font-weight="700">Zapret Control</text>
    <text x="46" y="103" fill="#00F5FF" opacity="0.45" font-size="44" font-weight="700">Zapret Control</text>
    <text x="45" y="103" fill="#E7F2FF" font-size="44" font-weight="700">Zapret Control</text>
  </g>

  <text x="46" y="136" fill="#7C8DA6" font-size="15" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace">GUI-управлятор zapret-discord-youtube · Windows 10/11</text>

  <line x1="0" y1="175" x2="1000" y2="175" stroke="url(#line)" stroke-width="2"/>
</svg>
